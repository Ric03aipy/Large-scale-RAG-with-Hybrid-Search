<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 610" width="1010" height="610" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>local-hybrid-rag architecture</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1010" height="610" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#111827">local-hybrid-rag: services (Docker Compose) and data flow</text>
<rect x="12" y="250" width="98" height="60" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
<text x="61.0" y="284.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Browser</text>
<rect x="140" y="225" width="160" height="110" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
<text x="220.0" y="270.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">ui</text>
<text x="220.0" y="284.5" text-anchor="middle" font-size="10.5" fill="#374151">Gradio · :7860</text>
<text x="220.0" y="298.9" text-anchor="middle" font-size="10.5" fill="#374151">upload · ask · settings</text>
<line x1="110" y1="280" x2="140" y2="280" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="370" y="50" width="340" height="522" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="1.8"/>
<text x="390" y="78" font-size="14" font-weight="bold" fill="#111827">api · FastAPI · :8000</text>
<line x1="300" y1="268" x2="370" y2="268" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="335" y="260" text-anchor="middle" font-size="10.5" fill="#374151">HTTP</text>
<line x1="370" y1="296" x2="300" y2="296" stroke="#374151" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<text x="335" y="312" text-anchor="middle" font-size="10.5" fill="#374151">answer</text>
<text x="390" y="108" font-size="12" font-weight="bold" fill="#065f46">POST /ingest</text>
<rect x="390" y="118" width="300" height="44" rx="8" fill="#d1fae5" stroke="#374151" stroke-width="1.5"/>
<text x="540.0" y="137.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">load file · split into chunks</text>
<text x="540.0" y="151.7" text-anchor="middle" font-size="10.5" fill="#374151">LangChain splitter (chunk size / overlap)</text>
<rect x="390" y="178" width="300" height="44" rx="8" fill="#d1fae5" stroke="#374151" stroke-width="1.5"/>
<text x="540.0" y="197.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">embed each chunk (CPU)</text>
<text x="540.0" y="211.7" text-anchor="middle" font-size="10.5" fill="#374151">dense: bge-small-en-v1.5 · sparse: SPLADE</text>
<rect x="390" y="238" width="300" height="44" rx="8" fill="#d1fae5" stroke="#374151" stroke-width="1.5"/>
<text x="540.0" y="257.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">upsert points</text>
<text x="540.0" y="271.7" text-anchor="middle" font-size="10.5" fill="#374151">deterministic ids (re-upload overwrites)</text>
<line x1="540" y1="162" x2="540" y2="178" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="540" y1="222" x2="540" y2="238" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="390" y="318" font-size="12" font-weight="bold" fill="#1e40af">POST /ask</text>
<rect x="390" y="328" width="300" height="44" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
<text x="540.0" y="347.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">choose retrieval mode</text>
<text x="540.0" y="361.7" text-anchor="middle" font-size="10.5" fill="#374151">dense | sparse | hybrid | hybrid_rerank</text>
<rect x="390" y="388" width="300" height="44" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
<text x="540.0" y="407.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">query Qdrant</text>
<text x="540.0" y="421.7" text-anchor="middle" font-size="10.5" fill="#374151">hybrid: 15 dense + 15 sparse → RRF → top 10</text>
<rect x="390" y="448" width="300" height="44" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
<text x="540.0" y="467.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">optional rerank (hybrid_rerank)</text>
<text x="540.0" y="481.7" text-anchor="middle" font-size="10.5" fill="#374151">FlashRank · ms-marco-MiniLM-L-12-v2</text>
<rect x="390" y="508" width="300" height="44" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
<text x="540.0" y="527.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">top-k chunks → prompt (LCEL)</text>
<text x="540.0" y="541.7" text-anchor="middle" font-size="10.5" fill="#374151">answer only from the retrieved context</text>
<line x1="540" y1="372" x2="540" y2="388" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="540" y1="432" x2="540" y2="448" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="540" y1="492" x2="540" y2="508" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="800" y="130" width="190" height="300" rx="8" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>
<text x="895" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">qdrant_db</text>
<text x="895" y="178" text-anchor="middle" font-size="10.5" fill="#374151">:6333 · docker volume</text>
<text x="895" y="215" text-anchor="middle" font-size="10.5" fill="#374151">one collection,</text>
<text x="895" y="236" text-anchor="middle" font-size="10.5" fill="#374151">two vectors per chunk:</text>
<text x="895" y="257" text-anchor="middle" font-size="10.5" fill="#374151">dense (384-d, cosine)</text>
<text x="895" y="278" text-anchor="middle" font-size="10.5" fill="#374151">sparse (SPLADE)</text>
<text x="895" y="320" text-anchor="middle" font-size="10.5" fill="#374151">payload: chunk text +</text>
<text x="895" y="341" text-anchor="middle" font-size="10.5" fill="#374151">file name, start index</text>
<line x1="690" y1="260" x2="800" y2="260" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="745" y="252" text-anchor="middle" font-size="10.5" fill="#374151">upsert</text>
<line x1="690" y1="402" x2="800" y2="402" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="745" y="394" text-anchor="middle" font-size="10.5" fill="#374151">query</text>
<line x1="800" y1="420" x2="690" y2="420" stroke="#374151" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<text x="745" y="436" text-anchor="middle" font-size="10.5" fill="#374151">candidates</text>
<rect x="800" y="470" width="190" height="100" rx="8" fill="#ede9fe" stroke="#374151" stroke-width="1.5"/>
<text x="895.0" y="510.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">ollama</text>
<text x="895.0" y="524.5" text-anchor="middle" font-size="10.5" fill="#374151">:11434</text>
<text x="895.0" y="538.9" text-anchor="middle" font-size="10.5" fill="#374151">qwen2.5:1.5b</text>
<line x1="690" y1="522" x2="800" y2="522" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="745" y="514" text-anchor="middle" font-size="10.5" fill="#374151">prompt</text>
<line x1="800" y1="548" x2="690" y2="548" stroke="#374151" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<text x="745" y="564" text-anchor="middle" font-size="10.5" fill="#374151">answer</text>
<line x1="20" y1="560" x2="60" y2="560" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="68" y="564" text-anchor="start" font-size="10.5" fill="#374151">request / data</text>
<line x1="170" y1="560" x2="210" y2="560" stroke="#374151" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<text x="218" y="564" text-anchor="start" font-size="10.5" fill="#374151">response</text>
</svg>